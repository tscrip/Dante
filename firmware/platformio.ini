; DANTE firmware - ESP32-S3 + one screen (SSD1306 OLED or 3.5" ST7796 TFT) + 4 buttons,
; or the ESP32-3248S035C "yellow board" (3.5" TFT with a touch panel built in).
;
; `pio run -t upload` builds and flashes the ESP32-S3. For the yellow board:
;   pio run -e esp32-3248s035c -t upload
[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Octal PSRAM, as on "R8" modules (N8R8, N16R8): the TFT draws whole frames in it. The firmware still
; boots without PSRAM. For a quad-PSRAM "R2" module use qio_qspi; with no PSRAM this line can stay.
board_build.arduino.memory_type = qio_opi
lib_deps =
    olikraus/U8g2
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; Native USB port = `Serial` (CDC). The DevKit's "UART" port stays available as `Serial0`.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---- ESP32-3248S035C "yellow board": ESP32-WROOM-32 + 3.5" ST7796 TFT + GT911 capacitive touch ----
; A plain ESP32 (not an S3): no PSRAM, so the screen is drawn in strips; 4 MB flash; USB through a
; CH340 serial chip (Windows COMx, Linux /dev/ttyUSB0). Pins are in src/config.h (DANTE_BOARD_CYD35C).
[env:esp32-3248s035c]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
; Speed over size: this board has no PSRAM, so DANTE redraws the screen in strips and every bit of
; processor time shows as smoothness. The program runs from flash through a cache, so the flash is
; read at 80 MHz instead of the default 40. (If a board ever fails to start after flashing, set this
; back to 40000000L.) The code is compiled for speed (-O2) instead of size (-Os, Arduino's default):
; it grows a little, and this board has room to spare.
board_build.f_flash = 80000000L
lib_deps =
    olikraus/U8g2
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7
build_unflags = -Os
build_flags =
    -O2
    -DCORE_DEBUG_LEVEL=0
    -DDANTE_BOARD_CYD35C

; ---- DANTE simulator: the same firmware, compiled for your PC --------------------------------
; Build with `pio run -e simulator`; the PC app starts it (Simulator page / Device -> Simulator).
; Needs a C/C++ compiler on the PC: Linux gcc, macOS Xcode command line tools, Windows MinGW-w64.
; The screens are the real drawing code: u8g2 for the OLED/LCD, LovyanGFX for the TFT (into memory).
[env:simulator]
platform = native
lib_compat_mode = off
lib_deps =
    olikraus/U8g2
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7
build_flags =
    -DDANTE_SIMULATOR
    -DARDUINO=10800
    -I simulator/host
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_PROGMEM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=1
    -lpthread
build_cxxflags = -std=gnu++17
