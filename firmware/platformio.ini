; DANTE firmware - ESP32-S3 + one screen (SSD1306 OLED, 1602/2004 LCD or 3.5" ST7796 TFT) + 4 buttons
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
; Octal PSRAM, as on "R8" modules (N8R8, N16R8): the TFT draws whole frames in it. The firmware still
; boots without PSRAM. For a quad-PSRAM "R2" module use qio_qspi; with no PSRAM this line can stay.
board_build.arduino.memory_type = qio_opi
lib_deps =
    olikraus/U8g2
    lovyan03/LovyanGFX@^1.2.7
    bblanchon/ArduinoJson@^7
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DBOARD_HAS_PSRAM
    ; Native USB port = `Serial` (CDC). The DevKit's "UART" port stays available as `Serial0`.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
