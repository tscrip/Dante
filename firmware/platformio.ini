; DeskBuddy firmware - ESP32-S3 + SSD1306 128x32 OLED(s) or 1602/2004 LCD + 4 buttons
[env:esp32-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
lib_deps =
    olikraus/U8g2
    bblanchon/ArduinoJson@^7
build_flags =
    -DCORE_DEBUG_LEVEL=0
    ; Native USB port = `Serial` (CDC). The DevKit's "UART" port stays available as `Serial0`.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
